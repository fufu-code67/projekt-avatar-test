<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekt Avatar Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #e0e0e0;
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0.7;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            z-index: 10;
        }
        #hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 13px;
            pointer-events: none;
            transition: opacity 3s;
            z-index: 10;
        }
        #status {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">Projekt Avatar Test</div>
    <div id="status">Lade Avatar…</div>
    <div id="hint">🖱️ Drehen | 🖱️🖱️ Zoomen | 🖱️🖱️🖱️ Verschieben</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const statusEl = document.getElementById('status');
        const hintEl = document.getElementById('hint');

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#16213e');
        scene.fog = new THREE.Fog('#16213e', 3, 15);

        // Camera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(1.8, 1.2, 2.2);
        camera.lookAt(0, 0.9, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambient = new THREE.AmbientLight('#8899bb', 1.5);
        scene.add(ambient);

        const keyLight = new THREE.DirectionalLight('#ffffff', 4);
        keyLight.position.set(3, 5, 3);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(1024, 1024);
        keyLight.shadow.camera.near = 0.1;
        keyLight.shadow.camera.far = 20;
        keyLight.shadow.camera.left = -3;
        keyLight.shadow.camera.right = 3;
        keyLight.shadow.camera.top = 3;
        keyLight.shadow.camera.bottom = -3;
        scene.add(keyLight);

        const rimLight = new THREE.DirectionalLight('#4466cc', 3);
        rimLight.position.set(-2, 1, -2);
        scene.add(rimLight);

        const fillLight = new THREE.DirectionalLight('#cc8844', 1.5);
        fillLight.position.set(0, 0.5, 2);
        scene.add(fillLight);

        // Ground shadow
        const groundGeo = new THREE.PlaneGeometry(10, 10);
        const groundMat = new THREE.ShadowMaterial({ opacity: 0.25 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // Subtle grid
        const gridHelper = new THREE.PolarGridHelper(3, 32, 24, 128, '#334466', '#223355');
        gridHelper.position.y = -1.49;
        scene.add(gridHelper);

        // Orbit controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.85, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 1.2;
        controls.maxDistance = 5;
        controls.maxPolarAngle = Math.PI * 0.75;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;
        controls.update();

        // Load model
        const loader = new GLTFLoader();
        loader.load(
            'assets/avatar-3d.glb',
            (gltf) => {
                const model = gltf.scene;
                
                // Center and scale
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                
                const targetHeight = 2.0;
                const scale = targetHeight / size.y;
                model.scale.setScalar(scale);
                
                // Place on ground
                const newBox = new THREE.Box3().setFromObject(model);
                model.position.y = -newBox.min.y;
                
                // Enable shadows
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                scene.add(model);
                
                const meshCount = gltf.parser.json.meshes?.length || '?';
                const vertCount = size.x > 0 ? 'geladen' : 'geladen';
                statusEl.textContent = `✓ Avatar ${vertCount} — ${meshCount} Mesh(es)`;
                
                // Fade hint on interaction
                renderer.domElement.addEventListener('pointerdown', () => {
                    hintEl.style.opacity = '0';
                }, { once: true });
            },
            (progress) => {
                const pct = Math.round((progress.loaded / progress.total) * 100);
                statusEl.textContent = `Lade Avatar… ${pct}%`;
            },
            (error) => {
                statusEl.textContent = '✗ Fehler beim Laden. Bitte Server starten.';
                statusEl.style.color = '#ff6666';
                console.error(error);
            }
        );

        // Render loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
